name: Build BodyExpertX Therapist APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-therapist/**'
      - '.github/workflows/build-therapist-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-therapist assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bodyexpertx-therapist-debug-apk
          path: android-therapist/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
