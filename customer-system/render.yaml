services:
  - type: web
    name: bodyexpertx-customer-demo
    runtime: node
    plan: free
    rootDir: customer-system
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DB_FILE
        value: /tmp/bodyexpertx.sqlite
