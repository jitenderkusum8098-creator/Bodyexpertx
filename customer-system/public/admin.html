<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BodyExpertX Admin</title><style>body{margin:0;background:#f3f5f9;color:#172033;font:16px system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px 14px}h1{font-size:26px}.panel{background:#fff;border:1px solid #dce3ec;border-radius:16px;padding:18px;margin:14px 0}input,button,select{font:inherit;padding:11px;border-radius:9px;border:1px solid #dce3ec}button{background:#172033;color:white;border:0;cursor:pointer}button.light{background:#eef1f6;color:#172033}.row{display:flex;gap:10px}.row input{flex:1}.hidden{display:none}.muted{color:#66758a;font-size:13px}.msg{background:#fff1ce;padding:10px;border-radius:8px;margin:10px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e9ef}td button{margin:2px;font-size:13px}.status{font-weight:700}</style></head><body><main class="wrap"><h1>BodyExpertX Admin Panel</h1><p class="muted">Customer lookup, login activity, booking history and completed massage counts.</p><section class="panel" id="login"><h2>Admin login</h2><form id="loginForm"><p><input id="username" autocomplete="username" placeholder="Admin username" required></p><p><input id="password" type="password" autocomplete="current-password" placeholder="Admin password" required></p><button>Login</button><div id="loginMsg" class="msg hidden"></div></form></section><section class="panel hidden" id="dashboard"><div class="row"><input id="query" placeholder="Search customer name or mobile"><button id="search">Search</button><button id="logout" class="light">Logout</button></div><div id="result" class="tablewrap"></div><div id="detail"></div><div id="msg" class="msg hidden"></div></section></main><script>const $=id=>document.getElementById(id);function show(id,s){$(id).textContent=s;$(id).classList.remove('hidden')}async function api(url,body,method='POST'){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});const d=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{username:$('username').value,password:$('password').value});$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');load()}catch(err){show('loginMsg',err.message)}};async function load(){try{const d=await api('/api/admin/customers?q='+encodeURIComponent($('query').value),null,'GET');$('result').innerHTML='<table><thead><tr><th>Customer</th><th>Mobile</th><th>Completed</th><th>Upcoming</th><th>Last login</th><th>Actions</th></tr></thead><tbody>'+d.customers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.mobile)+'</td><td>'+c.completed_count+'</td><td>'+c.upcoming_count+'</td><td>'+esc(c.last_login||'—')+'</td><td><button onclick="history('+c.id+')">History</button><button onclick="resetPass('+c.id+')">Reset password</button></td></tr>').join('')+'</tbody></table>'}catch(e){show('msg',e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.history=async id=>{try{const d=await api('/api/admin/customers/'+id+'/bookings',null,'GET');$('detail').innerHTML='<h3>'+esc(d.customer.name)+' — '+esc(d.customer.mobile)+'</h3>'+ (d.bookings.length?d.bookings.map(b=>'<p>'+esc(b.service_name)+' · '+esc(b.booking_date)+' · <span class="status">'+esc(b.status)+'</span> <select id="s'+b.id+'"><option>Booked</option><option>Completed</option><option>Cancelled</option></select> <button onclick="status('+b.id+')">Update</button></p>').join(''):'<p>No bookings.</p>')}catch(e){show('msg',e.message)}};window.status=async id=>{try{await api('/api/admin/bookings/'+id+'/status',{status:$('s'+id).value},'PATCH');show('msg','Booking status updated.');load()}catch(e){show('msg',e.message)}};window.resetPass=async id=>{if(!confirm('Reset this customer password? The current password cannot be viewed. A temporary password will be generated and shown once.'))return;try{const d=await api('/api/admin/customers/'+id+'/reset-password',{});show('msg','TEMPORARY PASSWORD (show only once): '+d.temporaryPassword+' — tell the caller and ask them to change it after login.');}catch(e){show('msg',e.message)}};$('search').onclick=load;$('query').onkeydown=e=>{if(e.key==='Enter')load()};$('logout').onclick=async()=>{await api('/api/admin/logout',{});location.reload()};</script></body></html>
