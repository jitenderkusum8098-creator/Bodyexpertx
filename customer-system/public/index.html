<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>BodyExpertX Customer Account</title><style>
:root{color-scheme:light;--ink:#152033;--muted:#68758a;--line:#dce3ec;--gold:#bd9452}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:var(--ink);font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:780px;margin:auto;padding:24px 16px}.brand{text-align:center;padding:18px}.brand h1{margin:0;font-size:30px;letter-spacing:1px}.brand p{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 24px #1720330a}.tabs{display:flex;gap:8px}.tabs button{flex:1}.field{display:grid;gap:6px;margin:14px 0}label{font-size:14px;font-weight:650}input,select,button{font:inherit;border-radius:10px;padding:12px;border:1px solid var(--line);width:100%}button{background:#142033;color:white;border:0;font-weight:650;cursor:pointer}button.secondary{background:#eef1f6;color:var(--ink)}button.gold{background:var(--gold);color:#fff}.hint,.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;background:#fff4db;margin:10px 0}.booking{padding:12px 0;border-bottom:1px solid var(--line)}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}@media(max-width:520px){.panel{padding:16px}.brand h1{font-size:25px}}
</style></head><body><main class="wrap"><header class="brand"><h1>BodyExpertX</h1><p>Customer Account & Massage History</p></header><section class="panel" id="auth"><div class="tabs"><button id="loginTab">Login</button><button id="registerTab" class="secondary">Create Account</button></div><form id="authForm"><div id="nameField" class="field hidden"><label for="name">Full name</label><input id="name" autocomplete="name" maxlength="80"></div><div class="field"><label for="mobile">Mobile number</label><input id="mobile" inputmode="tel" autocomplete="tel" placeholder="e.g. 9876543210" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required><span class="hint">Use at least 10 characters. No SMS OTP.</span></div><button id="submitAuth">Login</button><div id="authMsg" class="msg hidden" role="status"></div></form></section><section class="panel hidden" id="account"><div class="row"><div><h2 id="welcome">Your account</h2><p class="muted" id="accountMobile"></p></div><button id="logout" class="secondary">Logout</button></div><h3>Massage history</h3><p><strong id="count">0</strong> completed massage(s)</p><div id="history"></div><h3>Request a booking</h3><form id="bookingForm"><div class="field"><label for="service">Service name</label><input id="service" required maxlength="100" placeholder="e.g. Swedish Massage"></div><div class="field"><label for="date">Preferred date</label><input id="date" type="date" required></div><button class="gold">Save booking request</button><div id="bookingMsg" class="msg hidden"></div></form></section><p class="hint" style="text-align:center">For a forgotten password, call BodyExpertX admin. Admin can reset it; the old password is never visible.</p></main><script>
let mode='login';const $=id=>document.getElementById(id);function setMode(next){mode=next;$('nameField').classList.toggle('hidden',mode!=='register');$('password').autocomplete=mode==='register'?'new-password':'current-password';$('submitAuth').textContent=mode==='register'?'Create Account':'Login';$('loginTab').className=mode==='login'?'':'secondary';$('registerTab').className=mode==='register'?'':'secondary';$('authMsg').classList.add('hidden')}$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');function show(id,text){$(id).textContent=text;$(id).classList.remove('hidden')}async function api(url,body,method='POST'){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});const data=await r.json().catch(()=>({error:'Unexpected server response.'}));if(!r.ok)throw Error(data.error||'Request failed.');return data}$('authForm').onsubmit=async e=>{e.preventDefault();try{const data=await api(mode==='register'?'/api/register':'/api/login',{name:$('name').value,mobile:$('mobile').value,password:$('password').value});$('authMsg').classList.add('hidden');await loadAccount()}catch(err){show('authMsg',err.message)}};async function loadAccount(){try{const r=await fetch('/api/me',{credentials:'same-origin'});if(!r.ok)throw Error('not logged in');const d=await r.json();$('auth').classList.add('hidden');$('account').classList.remove('hidden');$('welcome').textContent='Hello, '+d.customer.name;$('accountMobile').textContent=d.customer.mobile;$('count').textContent=d.completedCount;$('history').innerHTML=d.bookings.length?d.bookings.map(b=>'<div class="booking"><strong>'+escapeHtml(b.service_name)+'</strong><br><span class="muted">'+escapeHtml(b.booking_date)+' · '+escapeHtml(b.status)+'</span></div>').join(''):'No bookings yet.'}catch{$('auth').classList.remove('hidden');$('account').classList.add('hidden')}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('logout').onclick=async()=>{await api('/api/logout',{});location.reload()};$('bookingForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/bookings',{serviceName:$('service').value,bookingDate:$('date').value});show('bookingMsg','Booking request saved. Admin can review it.');await loadAccount()}catch(err){show('bookingMsg',err.message)}};loadAccount();
</script></body></html>
