<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0f766e"><title>BEX Partner Admin | BodyExpertX</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#142e34;--muted:#718285;--teal:#0f766e;--mint:#def5ee;--line:#e2ebe8;--bg:#f4f8f7;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px 'DM Sans',sans-serif;color:var(--ink)}h1,h2,h3{font-family:Manrope,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--teal);color:white}.soft{background:var(--mint);color:#115e59}.ghost{background:white;border:1px solid var(--line);color:var(--ink)}input,select,textarea{width:100%;padding:11px;border:1px solid #dbe5e2;border-radius:10px;background:white}label{display:block;font-size:11px;font-weight:800;color:#52676a;margin-bottom:6px}.field{margin-bottom:13px}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.shell{max-width:1180px;margin:auto;padding:22px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 12px 34px #123c360b}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brandline{display:flex;align-items:center;gap:12px}.logo{background:var(--teal);color:white;font:800 16px Manrope;width:45px;height:45px;border-radius:13px;display:grid;place-items:center}.brand{font:800 20px Manrope}.mutedline{font-size:12px;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(100%,440px);padding:28px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:16px}.stat .n{font:800 24px Manrope;margin-top:7px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:white}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf1ef;font-size:12px}th{background:#fbfdfc;color:#6b7d7f;font-size:10px;letter-spacing:.4px}.pill{padding:5px 8px;border-radius:99px;background:#e4f7ec;color:#176a43;font-size:10px;font-weight:800}.pill.red{background:#ffebe8;color:#a62b20}.msg{margin:12px 0;padding:11px;border-radius:10px;background:#e4f7ec;color:#176a43;font-size:13px}.err{margin:12px 0;padding:11px;border-radius:10px;background:#ffebe8;color:#a62b20;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:760px){.shell{padding:12px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:flex-start}.card{padding:15px}}
</style></head><body><div id="root"><section class="login"><div class="card"><div class="brandline"><div class="logo">BEX</div><div><div class="brand">BEX Partner Admin</div><div class="mutedline">BodyExpertX · Admin-only access</div></div></div><h1>Admin login</h1><p class="muted">Sirf authorized BodyExpertX Admin hi partners register aur commission settings manage kar sakta hai.</p><div id="loginMsg"></div><form id="loginForm"><div class="field"><label>ADMIN EMAIL</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>ADMIN PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">Secure admin login</button></form></div></section></div>
<script>
const URL='https://myjstwbpmbrhaiwytpnq.supabase.co',KEY='sb_publishable_jHjVYTPlBLDgaNfiazRkvg_iVI_5-Xy',db=window.supabase.createClient(URL,KEY),root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n||0));
let session=null, partners=[], rules=[];
function loginView(msg=''){root.innerHTML=`<section class="login"><div class="card"><div class="brandline"><div class="logo">BEX</div><div><div class="brand">BEX Partner Admin</div><div class="mutedline">BodyExpertX · Admin-only access</div></div></div><h1>Admin login</h1><p class="muted">Sirf authorized BodyExpertX Admin hi partners register aur commission settings manage kar sakta hai.</p>${msg?`<div class="err">${esc(msg)}</div>`:''}<form id="loginForm"><div class="field"><label>ADMIN EMAIL</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>ADMIN PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">Secure admin login</button></form></div></section>`;document.getElementById('loginForm').onsubmit=login;}
async function login(e){e.preventDefault();const {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){loginView('Login failed. Admin credentials check karein.');return;}session=data.session;const {data:profile,error:pErr}=await db.from('user_profiles').select('role').eq('user_id',data.user.id).maybeSingle();if(pErr||profile?.role!=='admin'){await db.auth.signOut();loginView('Is account ko Admin permission nahi hai.');return;}await dashboard();}
async function callAdmin(payload){const {data:{session:s}}=await db.auth.getSession();const res=await fetch(URL+'/functions/v1/bex-partner-admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':KEY},body:JSON.stringify(payload)});const out=await res.json();if(!res.ok)throw new Error(out.error||'Request failed');return out;}
async function dashboard(){const [p,r,c,b]=await Promise.all([db.from('partners').select('*').order('created_at',{ascending:false}),db.from('partner_commission_rules').select('*').order('category').order('service_tier'),db.from('partner_commissions').select('id,partner_id,booking_id,service_tier,commission_amount,status,earned_at,paid_at,payment_reference,partners(business_name,partner_code)').order('created_at',{ascending:false}),db.from('booking_assignments').select('id,reference_code,partner_id,partner_referral_id,status,tier,booking_amount,payment_verified,created_at,customer_name,customer_phone').not('partner_id','is',null).order('created_at',{ascending:false})]);if(p.error||r.error||c.error||b.error){root.innerHTML='<div class="shell"><div class="card"><h2>Database setup pending</h2><p class="muted">BEX Partner schema migration complete hone ke baad admin dashboard load hoga.</p><p>'+esc(p.error?.message||r.error?.message||c.error?.message||b.error?.message||'')+'</p><button class="ghost" onclick="location.reload()">Retry</button></div></div>';return;}partners=p.data||[];rules=r.data||[];const bookings=b.data||[],commissions=c.data||[],earned=commissions.reduce((s,x)=>s+Number(x.commission_amount),0),paid=commissions.filter(x=>x.status==='paid').reduce((s,x)=>s+Number(x.commission_amount),0);
root.innerHTML=`<div class="shell"><header class="top"><div class="brandline"><div class="logo">BEX</div><div><div class="brand">BEX Partner Admin</div><div class="mutedline">Partner registration · Commission control</div></div></div><div class="actions"><a href="./index.html"><button class="ghost">Partner login page</button></a><button class="ghost" id="logout">Logout</button></div></header>
<div class="stats"><div class="stat"><div class="mutedline">Registered partners</div><div class="n">${partners.length}</div></div><div class="stat"><div class="mutedline">Active partners</div><div class="n">${partners.filter(p=>p.status==='active').length}</div></div><div class="stat"><div class="mutedline">Total commission earned</div><div class="n">${money(earned)}</div></div><div class="stat"><div class="mutedline">Paid commission</div><div class="n">${money(paid)}</div></div></div>
<div class="grid"><div class="card"><h2 style="margin-top:0">Register a business partner</h2><p class="muted small">Salon, Gym, Medical Store ya Other. Account sirf Admin create karega.</p><div id="createMsg"></div><form id="createForm" class="formgrid"><div><label>BUSINESS NAME</label><input name="business_name" required maxlength="120" placeholder="Sharma Salon"></div><div><label>OWNER NAME</label><input name="owner_name" required maxlength="100" placeholder="Owner full name"></div><div><label>BUSINESS CATEGORY</label><select name="category" required><option value="Salon">Salon</option><option value="Gym">Gym</option><option value="Medical Store">Medical Store</option><option value="Other">Other</option></select></div><div><label>MOBILE NUMBER</label><input name="phone" inputmode="numeric" pattern="[0-9+() -]{10,18}" required placeholder="10-digit mobile"></div><div class="wide"><label>LOGIN USER ID (AUTO-GENERATED, EDITABLE)</label><input name="login_id" required minlength="3" placeholder="sharma-salon"></div><div class="wide"><label>FULL BUSINESS ADDRESS</label><textarea name="full_address" required rows="2" placeholder="Shop no., street, area, city, PIN"></textarea></div><div class="wide"><label>BUSINESS / OWNER PHOTO</label><input name="photo" type="file" accept="image/png,image/jpeg,image/webp"><div class="mutedline">JPG/PNG/WebP · max 5 MB</div></div><div class="wide"><button class="primary">Create partner login</button></div></form><div class="mutedline">Initial password = registered mobile number. Partner must change it on first login.</div></div>
<div class="card"><h2 style="margin-top:0">Commission rules</h2><p class="muted small">Category + service-wise default rates. Individual partner override bhi set ho sakta hai.</p><div id="ruleMsg"></div><form id="ruleForm"><div class="field"><label>CATEGORY</label><select name="category"><option>Gym</option><option>Salon</option><option>Medical Store</option><option>Other</option></select></div><div class="field"><label>PARTNER OVERRIDE (OPTIONAL)</label><select name="partner_id"><option value="">Use category default</option>${partners.map(p=>`<option value="${p.id}">${esc(p.business_name)} · ${esc(p.partner_code)}</option>`).join('')}</select></div><div class="field"><label>SERVICE TIER</label><select name="service_tier"><option>Prime</option><option>Luxe</option><option>Other</option></select></div><div class="formgrid"><div><label>COMMISSION TYPE</label><select name="commission_type"><option value="fixed">Fixed ₹</option><option value="percent">Percentage %</option></select></div><div><label>AMOUNT</label><input name="amount" type="number" min="0" step=".01" required placeholder="50"></div></div><div class="field" style="margin-top:12px"><label>ELIGIBILITY RULE</label><select name="rule_mode"><option value="first">First completed booking only</option><option value="every" selected>Every eligible booking</option><option value="period">Limited period</option></select></div><div class="field hidden" id="validityField"><label>VALIDITY (MONTHS)</label><select name="validity_months"><option>1</option><option selected>3</option><option>6</option><option>12</option></select></div><button class="primary">Save commission rule</button></form></div></div>
<div style="margin:22px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">Registered partners</h2><span class="pill">${partners.length} total</span></div><div class="tablewrap"><table><thead><tr><th>Partner</th><th>Category</th><th>Partner ID</th><th>Login ID</th><th>Mobile</th><th>Status</th><th>Action</th></tr></thead><tbody>${partners.map(p=>`<tr><td><b>${esc(p.business_name)}</b><br><span class="muted">${esc(p.owner_name)}</span></td><td>${esc(p.category)}</td><td>${esc(p.partner_code)}</td><td>${esc(p.login_id)}</td><td>${esc(p.phone)}</td><td><span class="pill ${p.status==='active'?'':'red'}">${esc(p.status)}</span></td><td><button class="ghost statusBtn" data-id="${p.id}" data-status="${p.status==='active'?'suspended':'active'}">${p.status==='active'?'Suspend':'Activate'}</button></td></tr>`).join('')||'<tr><td colspan="7">No partners registered yet.</td></tr>'}</tbody></table></div>
<div style="margin:22px 0 12px"><h2 style="margin:0">Commission ledger</h2></div><div class="tablewrap"><table><thead><tr><th>Partner</th><th>Booking ref</th><th>Service</th><th>Amount</th><th>Status</th><th>Payment reference</th><th>Action</th></tr></thead><tbody>${commissions.map(c=>`<tr><td>${esc(c.partners?.business_name||'Partner')}</td><td>${esc(c.booking_id.slice(0,8).toUpperCase())}</td><td>${esc(c.service_tier)}</td><td><b>${money(c.commission_amount)}</b></td><td><span class="pill ${c.status==='paid'?'':'red'}">${esc(c.status)}</span></td><td>${esc(c.payment_reference||'—')}</td><td>${c.status==='earned'?'<button class="soft payBtn" data-id="'+c.id+'">Mark paid</button>':'—'}</td></tr>`).join('')||'<tr><td colspan="7">No commissions yet.</td></tr>'}</tbody></table></div>
<div style="margin:22px 0 12px"><h2 style="margin:0">Completed partner jobs · Payment verification</h2><p class="muted small">Commission tabhi banega jab job completed ho aur payment Admin verify kare.</p></div><div class="tablewrap"><table><thead><tr><th>Booking ref</th><th>Partner</th><th>Customer</th><th>Service</th><th>Job status</th><th>Payment</th><th>Action</th></tr></thead><tbody>${bookings.map(x=>{const p=partners.find(p=>p.id===x.partner_id);return `<tr><td>${esc(x.reference_code||x.id.slice(0,8).toUpperCase())}</td><td>${esc(p?.business_name||'Partner')}</td><td>${esc(x.customer_name||'Customer')}<br><span class="muted">${esc(x.customer_phone||'')}</span></td><td>${esc(x.tier||'—')}</td><td>${esc(x.status)}</td><td><span class="pill ${x.payment_verified?'':'red'}">${x.payment_verified?'Verified':'Not verified'}</span></td><td>${x.status==='completed'&&!x.payment_verified?'<button class="soft verifyBtn" data-id="'+x.id+'">Verify payment</button>':x.payment_verified?'Commission trigger checked':'Await completion'}</td></tr>`}).join('')||'<tr><td colspan="7">No referred bookings yet.</td></tr>'}</tbody></table></div>
<div class="muted small" style="text-align:center;margin:24px 0">BEX Partner Admin · Sensitive customer data is restricted to authorized users.</div></div>`;
document.getElementById('logout').onclick=async()=>{await db.auth.signOut();loginView();};
const nameInput=document.querySelector('[name="business_name"]'),idInput=document.querySelector('[name="login_id"]');nameInput.addEventListener('input',()=>{if(!idInput.dataset.edited)idInput.value=nameInput.value.normalize('NFKD').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,36);});idInput.addEventListener('input',()=>idInput.dataset.edited='1');
document.querySelector('[name="rule_mode"]').onchange=e=>document.getElementById('validityField').classList.toggle('hidden',e.target.value!=='period');
document.getElementById('createForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('createMsg');msg.innerHTML='';try{let photo_url=null;const file=f.get('photo');if(file&&file.size){if(file.size>5*1024*1024)throw new Error('Photo 5 MB se chhoti honi chahiye.');const ext=file.name.split('.').pop().toLowerCase(),path='partners/'+crypto.randomUUID()+'.'+ext;const {error:upErr}=await db.storage.from('partner-profiles').upload(path,file,{upsert:false,contentType:file.type});if(upErr)throw upErr;photo_url=db.storage.from('partner-profiles').getPublicUrl(path).data.publicUrl;}const out=await callAdmin({action:'create_partner',business_name:f.get('business_name'),owner_name:f.get('owner_name'),category:f.get('category'),phone:f.get('phone'),login_id:f.get('login_id'),full_address:f.get('full_address'),photo_url});msg.innerHTML='<div class="msg"><b>Partner created successfully.</b><br>Login ID: <b>'+esc(out.partner.login_id)+'</b><br>Initial password (mobile): <b>'+esc(out.initial_password)+'</b><br>Partner ID: '+esc(out.partner.partner_code)+'<br>First login par password change karna hoga.</div>';e.target.reset();idInput.dataset.edited='';await dashboard();}catch(err){msg.innerHTML='<div class="err">'+esc(err.message)+'</div>';}}
document.getElementById('ruleForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('ruleMsg');try{const out=await callAdmin({action:'save_commission_rule',category:f.get('category'),partner_id:f.get('partner_id')||null,service_tier:f.get('service_tier'),commission_type:f.get('commission_type'),amount:f.get('amount'),rule_mode:f.get('rule_mode'),validity_months:f.get('validity_months')});msg.innerHTML='<div class="msg">Commission rule saved.</div>';await dashboard();}catch(err){msg.innerHTML='<div class="err">'+esc(err.message)+'</div>';}}
document.querySelectorAll('.statusBtn').forEach(b=>b.onclick=async()=>{try{await callAdmin({action:'set_partner_status',partner_id:b.dataset.id,status:b.dataset.status});await dashboard();}catch(e){alert(e.message);}});
document.querySelectorAll('.payBtn').forEach(b=>b.onclick=async()=>{const ref=prompt('Payment transaction reference / UTR:');if(!ref)return;try{await callAdmin({action:'mark_commission_paid',commission_id:b.dataset.id,payment_reference:ref});await dashboard();}catch(e){alert(e.message);}});
document.querySelectorAll('.verifyBtn').forEach(b=>b.onclick=async()=>{if(!confirm('Confirm karein ki is completed booking ka payment verify ho gaya hai?'))return;try{await callAdmin({action:'verify_booking_payment',booking_id:b.dataset.id});await dashboard();}catch(e){alert(e.message);}});
}
document.getElementById('loginForm').onsubmit=login;
db.auth.getSession().then(({data})=>{if(data.session){db.from('user_profiles').select('role').eq('user_id',data.session.user.id).maybeSingle().then(({data:p})=>p?.role==='admin'?dashboard():loginView('Admin access required.'));}});
</script></body></html>
