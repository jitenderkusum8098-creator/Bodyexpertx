document.getElementById("logout").onclick=async()=>{await db.auth.signOut();authPage()};document.getElementById("refresh").onclick=load;document.getElementById("copyid").onclick=()=>copy(p.partner_code);document.getElementById("copylink").onclick=document.getElementById("copyqr").onclick=document.getElementById("copycontact").onclick=()=>copy(link(p.partner_code));document.getElementById("printqr").onclick=()=>window.print();document.getElementById("wa").onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent(p.business_name+" "+link(p.partner_code)),"_blank");document.querySelectorAll("[data-panel]").forEach(b=>b.onclick=()=>open(b.dataset.panel));document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>open(b.dataset.go));document.getElementById("filter").onchange=filterEarn;let q=document.getElementById("qr");if(window.QRCode)new QRCode(q,{text:link(p.partner_code),width:200,height:200,correctLevel:QRCode.CorrectLevel.H});setupProfile(p)}
function open(n){document.querySelectorAll("[data-panel]").forEach(b=>b.classList.toggle("active",b.dataset.panel===n));document.querySelectorAll(".panel").forEach(b=>b.classList.toggle("active",b.id==="panel-"+n));if(n==="notifications")api({action:"mark_partner_notifications_read"}).catch(()=>{});window.scrollTo({top:0,behavior:"smooth"})}
function copy(t){navigator.clipboard?navigator.clipboard.writeText(t).then(()=>alert("कॉपी हो गया।")).catch(()=>prompt("कॉपी करें",t)):prompt("कॉपी करें",t)}
function earnTable(a){return !a.length?'<div class="empty">अभी कमाई रिकॉर्ड नहीं है।</div>':'<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Service</th><th>Booking Amount</th><th>Commission</th><th>Date</th><th>Status</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.customer_name||"ग्राहक")+'</td><td>'+esc(x.service_name||x.service_tier||"—")+'</td><td>'+money(x.booking_amount)+'</td><td><b>'+money(x.commission_amount)+'</b></td><td>'+new Date(x.earned_at||x.created_at).toLocaleDateString("hi-IN")+'</td><td>'+esc(x.status)+'</td></tr>').join("")+'</tbody></table></div>'}
function refTable(a,cs){return !a.length?'<div class="empty">अभी रेफरल रिकॉर्ड नहीं है।</div>':'<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Referral Date</th><th>Booking Date</th><th>Service</th><th>Commission</th><th>Status</th></tr></thead><tbody>'+a.map(r=>{let c=cs.find(x=>x.referral_id===r.id);return '<tr><td>'+esc(r.customer_name||"ग्राहक")+'</td><td>'+new Date(r.created_at).toLocaleDateString("hi-IN")+'</td><td>'+(r.last_booking_at?new Date(r.last_booking_at).toLocaleDateString("hi-IN"):"—")+'</td><td>'+esc(r.latest_service_tier||c?.service_name||"—")+'</td><td>'+money(c?.commission_amount||0)+'</td><td>'+esc(r.latest_booking_status||r.status||"—")+'</td></tr>'}).join("")+'</tbody></table></div>'}
function visitTable(a){return !a.length?'<div class="empty">अभी visit record नहीं है।</div>':'<div class="tablewrap"><table><thead><tr><th>Date</th><th>Source</th><th>Visitor Reference</th></tr></thead><tbody>'+a.map(v=>'<tr><td>'+new Date(v.created_at).toLocaleString("hi-IN")+'</td><td>'+esc(v.source_type)+'</td><td>'+esc(v.visitor_key||"Anonymous")+'</td></tr>').join("")+'</tbody></table></div>'}
function paymentTable(a){return !a.length?'<div class="empty">अभी कोई payment नहीं।</div>':'<div class="tablewrap"><table><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Transaction ID</th><th>Status</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+new Date(x.payment_date).toLocaleDateString("hi-IN")+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.payment_method)+'</td><td>'+esc(x.transaction_id||"—")+'</td><td>'+esc(x.status)+'</td></tr>').join("")+'</tbody></table></div>'}
function filterEarn(){let v=document.getElementById("filter").value,a=(D.commissions||[]).filter(x=>x.status!=="void"),n=new Date();n.setHours(0,0,0,0);let m=new Date(n.getFullYear(),n.getMonth(),1);document.getElementById("earningsTable").innerHTML=earnTable(a.filter(x=>v==="today"?new Date(x.earned_at||x.created_at)>=n:v==="month"?new Date(x.earned_at||x.created_at)>=m:true))}
function addEditPm(v={}){let w=document.getElementById("editPms");if(!w||w.children.length>=8)return;let el=document.createElement("div");el.className="payrow";el.dataset.qr=v.qr_image||"";el.innerHTML='<div class="formgrid"><div><label>Payment Type</label><select class="pt">'+["UPI ID","Google Pay","PhonePe","Other UPI","QR Image"].map(x=>'<option '+(v.type===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div><div><label>UPI ID / Mobile</label><input class="pv" value="'+esc(v.value||"")+'"></div><div class="wide"><label>QR Image</label><input class="pq" type="file" accept="image/*"><img class="preview '+(v.qr_image?"":"hidden")+'" src="'+esc(v.qr_image||"")+'"></div><button type="button" class="ghost rm">Remove</button></div>';el.querySelector(".pq").onchange=async e=>{try{el.dataset.qr=await imageData(e.target.files[0]);let im=el.querySelector("img");im.src=el.dataset.qr;im.classList.remove("hidden")}catch(er){alert(er.message)}};el.querySelector(".rm").onclick=()=>el.remove();w.appendChild(el)}
async function setupProfile(p){let w=document.getElementById("editPms");(p.payment_methods||[]).forEach(v=>addEditPm(v));document.getElementById("addEditPm").onclick=()=>addEditPm();document.getElementById("pf").onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{await api({action:"save_partner_self_profile",business_name:ebn.value,category:ecat.value,category_other:eother.value,owner_name:eowner.value,phone:ephone.value,full_address:eaddr.value,city:ecity.value,state:estate.value,pincode:epin.value,photo_url:await imageData(epic.files[0])||p.photo_url||"",owner_photo_url:await imageData(eopic.files[0])||p.owner_photo_url||"",payment_methods:[...w.querySelectorAll(".payrow")].map(x=>({type:x.querySelector(".pt").value,value:x.querySelector(".pv").value,qr_image:x.dataset.qr||""}))});note("pfmsg","प्रोफाइल सेव हो गई। Unique Partner ID नहीं बदली।","success");await load()}catch(er){note("pfmsg",er.message)}finally{b.disabled=false}}}
async function track(){let code=new URLSearchParams(location.search).get("partner");if(!code)return;let k=localStorage.getItem("bexVisitor");if(!k){k=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();localStorage.setItem("bexVisitor",k)}try{await api({action:"record_partner_visit",partner_code:code,visitor_key:k,source_type:"link",landing_path:location.pathname},false)}catch(e){console.warn(e)}}
authPage();track();db.auth.getSession().then(x=>{if(x.data.session)load()});
</script></body></html>
